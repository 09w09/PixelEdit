<script>
/* bootstrap.js */
(()=>{
  const PE=globalThis.PixelEditor||(globalThis.PixelEditor={version:15,model:{},commands:{},renderer:{},interaction:{},persistence:{},ui:{}});
  PE.version=15;
  if(!PE.boot){
    PE.boot=()=>{if(typeof document==='undefined')return;document.documentElement.dataset.pixelEditor='v15';if(PE.ui.Workspace){PE.app=new PE.ui.Workspace().mount();}else{const status=document.getElementById('statusText');if(status)status.textContent='V15 core ready';globalThis.PixelEditorTest={version:15,namespace:PE};}};
    if(typeof document!=='undefined'){if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>PE.boot(),{once:true});else queueMicrotask(()=>PE.boot());}
  }
})();


/* model/ids.js */
(()=>{const PE=globalThis.PixelEditor; let seq=0; PE.model.nextId=(prefix='id')=>`${prefix}-${Date.now().toString(36)}-${(++seq).toString(36)}`; PE.model.resetIdSequenceForTest=()=>{seq=0;};})();


/* model/Hash.js */
(()=>{const M=globalThis.PixelEditor.model;const K=new Uint32Array([0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);const R=(x,n)=>(x>>>n)|(x<<(32-n));function fallback(input){const b=input instanceof Uint8Array?input:new Uint8Array(input),bitLen=b.length*8,total=((b.length+9+63)>>6)<<6,msg=new Uint8Array(total);msg.set(b);msg[b.length]=0x80;const dv=new DataView(msg.buffer);const hi=Math.floor(bitLen/0x100000000),lo=bitLen>>>0;dv.setUint32(total-8,hi,false);dv.setUint32(total-4,lo,false);let h0=0x6a09e667,h1=0xbb67ae85,h2=0x3c6ef372,h3=0xa54ff53a,h4=0x510e527f,h5=0x9b05688c,h6=0x1f83d9ab,h7=0x5be0cd19;const w=new Uint32Array(64);for(let off=0;off<total;off+=64){for(let i=0;i<16;i++)w[i]=dv.getUint32(off+i*4,false);for(let i=16;i<64;i++){const s0=(R(w[i-15],7)^R(w[i-15],18)^(w[i-15]>>>3))>>>0,s1=(R(w[i-2],17)^R(w[i-2],19)^(w[i-2]>>>10))>>>0;w[i]=(w[i-16]+s0+w[i-7]+s1)>>>0;}let a=h0,bv=h1,c=h2,d=h3,e=h4,f=h5,g=h6,h=h7;for(let i=0;i<64;i++){const S1=(R(e,6)^R(e,11)^R(e,25))>>>0,ch=((e&f)^((~e)&g))>>>0,t1=(h+S1+ch+K[i]+w[i])>>>0,S0=(R(a,2)^R(a,13)^R(a,22))>>>0,maj=((a&bv)^(a&c)^(bv&c))>>>0,t2=(S0+maj)>>>0;h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=bv;bv=a;a=(t1+t2)>>>0;}h0=(h0+a)>>>0;h1=(h1+bv)>>>0;h2=(h2+c)>>>0;h3=(h3+d)>>>0;h4=(h4+e)>>>0;h5=(h5+f)>>>0;h6=(h6+g)>>>0;h7=(h7+h)>>>0;}return[h0,h1,h2,h3,h4,h5,h6,h7].map(x=>x.toString(16).padStart(8,'0')).join('');}M.sha256Bytes=async input=>{const b=input instanceof Uint8Array?input:new Uint8Array(input);try{if(globalThis.crypto?.subtle){const out=await globalThis.crypto.subtle.digest('SHA-256',b);return[...new Uint8Array(out)].map(x=>x.toString(16).padStart(2,'0')).join('');}}catch{}return fallback(b);};M.sha256BytesFallback=fallback;})();


/* model/AssetStore.js */
(()=>{const M=globalThis.PixelEditor.model; class AssetStore{constructor(records=[]){this.map=new Map();this.runtime=new Map();for(const r of records||[])this.map.set(r.id,structuredClone(r));}add(type,dataUrl,meta={}){const id=M.nextId('asset');this.map.set(id,{id,type,dataUrl,meta:structuredClone(meta)});return id;}set(record){this.map.set(record.id,structuredClone(record));return record.id;}get(id){return this.map.get(id)||null;}has(id){return this.map.has(id);}findBySha256(type,sha256){for(const r of this.map.values())if(r.type===type&&r.meta?.sha256===sha256)return structuredClone(r);return null;}setRuntime(id,value){this.runtime.set(id,value);return value;}getRuntime(id){return this.runtime.get(id)||null;}delete(id){this.runtime.delete(id);return this.map.delete(id);}records(){return [...this.map.values()].map(x=>structuredClone(x));}bytes(){let n=0;for(const r of this.map.values())n+=String(r.dataUrl||'').length;return n;}referenced(ids){const out=[];for(const id of ids)if(this.map.has(id))out.push(structuredClone(this.map.get(id)));return out;}} M.AssetStore=AssetStore;})();


/* model/Node.js */
(()=>{const M=globalThis.PixelEditor.model;const I=v=>Number.isFinite(Number(v))?Math.round(Number(v)):0;const LABEL={rectangle:'矩形',circle:'圆',polygon:'多边形',line:'直线',text:'文字',image:'图片'};const dither=()=>({type:'bayer',density:50,matrix:4,align:'object',offsetX:0,offsetY:0});const pattern=()=>({type:'horizontal',lineWidth:1,gap:2,align:'object',offsetX:0,offsetY:0});
function base(type,p={}){if(type==='background')throw new Error('V15 中页面本身就是背景');return{id:p.id||M.nextId(type),type,name:p.name||LABEL[type]||type,parentId:p.parentId??null,visible:p.visible!==false,locked:!!p.locked};}
function createNode(type,p={}){const n=base(type,p);if(type==='line')return Object.assign(n,{x1:I(p.x1),y1:I(p.y1),x2:I(p.x2??20),y2:I(p.y2??20),lineWidth:Math.max(0,I(p.lineWidth??1)),overlay:structuredClone(p.overlay||{})});if(type==='polygon')return Object.assign(n,{points:(p.points||[{x:0,y:20},{x:20,y:0},{x:40,y:20}]).map(q=>({x:I(q.x),y:I(q.y)})).slice(0,24),lineWidth:Math.max(0,I(p.lineWidth??1)),fill:structuredClone(p.fill||{mode:'transparent'}),dither:structuredClone(p.dither||dither()),pattern:structuredClone(p.pattern||pattern()),overlay:structuredClone(p.overlay||{})});const common={x:I(p.x),y:I(p.y),w:Math.max(1,I(p.w??40)),h:Math.max(1,I(p.h??30)),aspectLocked:!!p.aspectLocked,overlay:structuredClone(p.overlay||{})};Object.assign(n,common);if(type==='rectangle')Object.assign(n,{rTL:Math.max(0,I(p.rTL)),rTR:Math.max(0,I(p.rTR)),rBL:Math.max(0,I(p.rBL)),rBR:Math.max(0,I(p.rBR)),lineWidth:Math.max(0,I(p.lineWidth??1)),fill:structuredClone(p.fill||{mode:'transparent'}),dither:structuredClone(p.dither||dither()),pattern:structuredClone(p.pattern||pattern())});else if(type==='circle')Object.assign(n,{lineWidth:Math.max(0,I(p.lineWidth??1)),fill:structuredClone(p.fill||{mode:'transparent'}),dither:structuredClone(p.dither||dither()),pattern:structuredClone(p.pattern||pattern())});else if(type==='text')Object.assign(n,{text:p.text??'文字',fontFamily:p.fontFamily||'sans-serif',fontSize:Math.max(1,I(p.fontSize??16)),fixedFontSize:p.fixedFontSize??null,letterSpacing:I(p.letterSpacing),lineSpacing:I(p.lineSpacing),alignH:p.alignH||'left',alignV:p.alignV||'top',wrap:p.wrap!==false,bold:!!p.bold,invert:!!p.invert,fill:structuredClone(p.fill||{mode:'solid'}),dither:structuredClone(p.dither||dither()),pattern:structuredClone(p.pattern||pattern())});else if(type==='image')Object.assign(n,{assetId:p.assetId||null,sourceWidth:Math.max(1,I(p.sourceWidth??common.w)),sourceHeight:Math.max(1,I(p.sourceHeight??common.h)),sourceType:p.sourceType||'bitmap',sourceName:p.sourceName||'',svgViewBox:p.svgViewBox||null,image:Object.assign({fit:'stretch',interpolation:'nearest',cropX:0,cropY:0,cropW:Math.max(1,I(p.sourceWidth??common.w)),cropH:Math.max(1,I(p.sourceHeight??common.h)),bwMode:'threshold',threshold:128,invert:false,ditherAlgorithm:'bayer',bayerMatrix:4},p.image||{})});else throw new Error(`unknown node type: ${type}`);return n;}
M.createNode=createNode;M.defaultDither=dither;M.defaultPattern=pattern;M.asInt=I;})();

/* model/Page.js */
(()=>{const M=globalThis.PixelEditor.model;M.createPage=(name='页面 1')=>({id:M.nextId('page'),name,width:400,height:300,locked:false,fill:{mode:'solid',value:0},dither:M.defaultDither(),pattern:M.defaultPattern(),overlay:{},nodes:[]});})();

/* model/Project.js */
(()=>{const M=globalThis.PixelEditor.model;M.defaultWorkspaceLayout=()=>({leftWidth:260,rightWidth:320,leftSplit:.5,rightSplit:.5});M.createProject=(name='未命名工程')=>{const page=M.createPage('页面 1');return{version:15,width:400,height:300,name,pages:[page],activePageId:page.id,fonts:[],workspaceLayout:M.defaultWorkspaceLayout()};};M.pageById=(project,id)=>project.pages.find(p=>p.id===id)||null;M.nodeById=(page,id)=>page?.nodes?.find(n=>n.id===id)||null;})();

/* model/TreeModel.js */
(()=>{const M=globalThis.PixelEditor.model;
class TreeModel{
 constructor(page){this.page=page;}
 node(id){return M.nodeById(this.page,id);}
 childrenOf(parentId){return this.page.nodes.filter(n=>n.parentId===parentId);}
 roots(){return this.childrenOf(this.page.id);}
 ancestorsOf(id){const out=[];let n=this.node(id),seen=new Set();while(n&&n.parentId&&n.parentId!==this.page.id){if(seen.has(n.parentId))throw new Error('cycle');seen.add(n.parentId);n=this.node(n.parentId);if(!n)throw new Error('orphan parent');out.push(n);}if(n&&n.parentId!==this.page.id)throw new Error('layer must descend from page');return out;}
 descendantsOf(id){const out=[];const walk=x=>{for(const c of this.childrenOf(x)){out.push(c);walk(c.id);}};walk(id);return out;}
