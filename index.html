<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>400×300 黑白像素编辑器 V17</title><style>:root{--bg:#181818;--panel:#242424;--panel2:#202020;--line:#444;--fg:#eee;--muted:#aaa;--left-w:260px;--right-w:320px;--top-h:42px;--status-h:24px;--ruler:28px}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;font-size:13px}.app{display:grid;grid-template-rows:var(--top-h) 1fr var(--status-h);height:100vh}.topbar,.status{display:flex;align-items:center;gap:6px;padding:5px 8px;background:#202020}.topbar{border-bottom:1px solid var(--line);overflow-x:auto}.status{border-top:1px solid var(--line);color:#bbb}.status #noticeText{margin-left:auto;color:#ddd}.grow{flex:1}.sep{height:24px;width:1px;background:#555;margin:0 4px}.align-actions{display:flex;gap:4px}.workspace{display:grid;grid-template-columns:var(--left-w) 6px minmax(300px,1fr) 6px var(--right-w);min-height:0}.sidebar{background:var(--panel);min-height:0;display:flex;flex-direction:column}.dock-pane{min-height:120px;display:flex;flex-direction:column;overflow:hidden}.dock-title{position:sticky;top:0;z-index:3;flex:0 0 auto;margin:0;padding:8px 10px;background:#2a2a2a;border-bottom:1px solid var(--line);font-size:12px}.dock-scroll{overflow:auto;min-height:0;padding:8px;flex:1 1 auto}.pane-splitter{height:7px;flex:0 0 7px;background:#373737;cursor:row-resize;border-top:1px solid #4b4b4b;border-bottom:1px solid #111}.width-splitter{background:#373737;cursor:col-resize}.width-splitter:hover,.pane-splitter:hover,.width-splitter:focus,.pane-splitter:focus{background:#737373;outline:none}.tool-section{margin-bottom:12px}.tool-section-title{font-size:11px;color:#aaa;margin:0 0 5px 2px}.tool-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}.tool-btn{display:flex;align-items:center;gap:6px;justify-content:flex-start}.tool-btn svg,.icon-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.tool-btn svg path[fill],.tool-btn.active svg{fill:currentColor}.tool-btn.active{background:#eee;color:#111}button,select,input,textarea{background:#303030;color:#eee;border:1px solid #555;border-radius:4px;padding:5px 7px;font:inherit}button:hover{background:#3a3a3a}button:disabled,input:disabled{opacity:.45}.page-row,.layer-row{display:flex;align-items:center;gap:3px;min-height:28px;border-radius:4px;padding:2px;margin:1px 0}.page-row{font-weight:600;border-top:1px solid #333}.page-row.active,.layer-row.selected{background:#464646}.page-main,.layer-main{flex:1;min-width:0;cursor:default;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.layer-main{padding-left:calc(var(--depth,0)*14px)}.layer-type{font-size:10px;color:#888}.icon-btn,.page-row .icon-btn,.layer-row .icon-btn{display:inline-grid;place-items:center;width:26px;height:26px;padding:4px;border:0;background:transparent;border-radius:3px;flex:0 0 26px}.icon-spacer{width:26px;flex:0 0 26px}.layer-row.drag-over{outline:1px solid #ddd}.guide-toolbar{display:flex;align-items:center;gap:3px;margin:6px 0}.field{margin:0 0 9px}.field>label{display:block;color:#bbb;font-size:11px;margin-bottom:3px}.field input,.field select,.field textarea{width:100%}.row{display:grid;grid-template-columns:1fr 1fr;gap:6px}.mixed::placeholder{color:#ddd}.check{display:flex;gap:6px;align-items:center}.check input{width:auto}.history-item{display:block;width:100%;text-align:left;margin:2px 0;background:#292929}.history-item.active{background:#eee;color:#111}#canvasArea{display:grid;grid-template-columns:var(--ruler) minmax(0,1fr);grid-template-rows:var(--ruler) minmax(0,1fr);min-width:0;min-height:0;background:#111;position:relative}#rulerCorner{grid-area:1/1;background:#242424;border-right:1px solid #555;border-bottom:1px solid #555;z-index:20}#topRuler{grid-area:1/2;width:100%;height:var(--ruler);background:#242424;display:block;z-index:20}#leftRuler{grid-area:2/1;width:var(--ruler);height:100%;background:#242424;display:block;z-index:20}#viewport{grid-area:2/2;overflow:auto;position:relative;padding:40px;background:#111}#stage{position:relative;width:400px;height:300px;transform-origin:top left;flex:none}#screenCanvas,#transparencyOverlayCanvas,#overlaySvg{position:absolute;left:0;top:0;width:400px;height:300px}#transparencyOverlayCanvas{pointer-events:none;image-rendering:pixelated;image-rendering:crisp-edges}#screenCanvas{background:white;box-shadow:0 0 0 1px #666;image-rendering:pixelated;image-rendering:crisp-edges}
#screenCanvas.has-transparency{background:repeating-conic-gradient(#d4d4d4 0% 25%,#fff 0% 50%) 50%/16px 16px}#overlaySvg{pointer-events:none;background:transparent;overflow:visible}.selection-box,.marquee-box,.smart-guide{fill:none;stroke:#168cff;stroke-width:1;vector-effect:non-scaling-stroke}.selection-box,.marquee-box{stroke-dasharray:4 3}.selection-handle{fill:#fff;stroke:#168cff;stroke-width:1;vector-effect:non-scaling-stroke}.context-menu{position:fixed;z-index:100;display:none;background:#292929;border:1px solid #666;border-radius:5px;padding:4px;min-width:150px}.context-menu.open{display:block}.context-menu button{display:block;width:100%;border:0;text-align:left}.danger{color:#ff9d9d}.mini-actions{display:flex;gap:4px;flex-wrap:wrap}.muted{color:#888;font-size:11px}.property-section{border-top:1px solid #3b3b3b;padding-top:7px;margin-top:7px}.property-section:first-child{border-top:0;margin-top:0}.property-section h4{margin:2px 0 8px;font-size:12px;color:#ddd}.corner-grid{display:grid;gap:4px}.point-row{display:grid;grid-template-columns:28px 1fr 1fr;gap:5px;align-items:end}.preview-wrap{display:flex;align-items:center;gap:8px;margin:6px 0}.pixel-preview{width:96px;height:96px;image-rendering:pixelated;border:1px solid #555;background:#fff}.image-preview{width:128px;height:96px;image-rendering:pixelated;border:1px solid #555;background:#fff}
</style></head><body>
<div class="app">
<header class="topbar"><button id="newBtn">新建</button><button id="openBtn">打开</button><button id="saveBtn">保存</button><button id="exportPngBtn">导出 PNG</button><span class="sep"></span><button id="undoBtn">撤销</button><button id="redoBtn">重做</button><span class="sep"></span><div class="align-actions"><button data-align="left" title="左对齐">左</button><button data-align="hcenter" title="水平居中">水平中</button><button data-align="right" title="右对齐">右</button><button data-align="top" title="顶对齐">顶</button><button data-align="vcenter" title="垂直居中">垂直中</button><button data-align="bottom" title="底对齐">底</button><button data-distribute="horizontal" title="水平分布">水平分布</button><button data-distribute="vertical" title="垂直分布">垂直分布</button></div><span class="grow"></span><label>缩放 <select id="zoomSelect"></select></label></header>
<main class="workspace">
<aside id="leftSidebar" class="sidebar left"><section id="leftTopPane" class="dock-pane"><h3 class="dock-title">工具</h3><div id="toolPalette" class="dock-scroll tool-palette">
<div class="tool-section"><div class="tool-section-title">选择</div><div class="tool-grid"><button data-tool="pointer" class="tool-btn active"><svg viewBox="0 0 24 24"><path d="M5 3l13 9-6 2 3 6-2 1-3-6-5 4z"/></svg><span>指针</span></button><button data-tool="select" class="tool-btn"><svg viewBox="0 0 24 24"><path d="M4 4h5v2H6v3H4zm11 0h5v5h-2V6h-3zM4 15h2v3h3v2H4zm14 0h2v5h-5v-2h3z"/></svg><span>选择</span></button></div></div>
<div class="tool-section"><div class="tool-section-title">编辑</div><div class="tool-grid"><button data-tool="pencil" class="tool-btn"><svg viewBox="0 0 24 24"><path d="M4 17l1 3 3 1L20 9l-4-4zM15 6l3 3"/></svg><span>铅笔</span></button><button data-tool="eraser" class="tool-btn"><svg viewBox="0 0 24 24"><path d="M5 15l7-9 7 6-6 8H8zM11 19h9"/></svg><span>橡皮</span></button></div></div>
<div class="tool-section"><div class="tool-section-title">元素</div><div class="tool-grid"><button data-tool="line" class="tool-btn"><svg viewBox="0 0 24 24"><path d="M5 19L19 5"/></svg><span>直线</span></button><button data-tool="rectangle" class="tool-btn"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14"/></svg><span>矩形</span></button><button data-tool="circle" class="tool-btn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/></svg><span>圆</span></button><button data-tool="polygon" class="tool-btn"><svg viewBox="0 0 24 24"><path d="M12 4l7 5-3 9H8L5 9z"/></svg><span>多边形</span></button><button data-tool="image" class="tool-btn"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14"/><circle cx="9" cy="10" r="2"/><path d="M5 18l5-5 3 3 2-2 4 4"/></svg><span>图片</span></button><button data-tool="text" class="tool-btn"><svg viewBox="0 0 24 24"><path d="M5 5h14M12 5v14M8 19h8"/></svg><span>文字</span></button></div></div>
</div></section><div id="leftPaneSplitter" class="pane-splitter horizontal" tabindex="0" aria-label="调整工具和页面图层高度"></div><section id="leftBottomPane" class="dock-pane"><h3 class="dock-title">页面 / 图层</h3><div id="pageLayerDock" class="dock-scroll"></div></section></aside>
<div id="leftWidthSplitter" class="width-splitter" tabindex="0" aria-label="调整左侧栏宽度"></div>
<section id="canvasArea"><div id="rulerCorner"></div><canvas id="topRuler"></canvas><canvas id="leftRuler"></canvas><div id="viewport"><div id="stage"><canvas id="screenCanvas" width="400" height="300"></canvas><canvas id="transparencyOverlayCanvas" width="400" height="300" aria-hidden="true"></canvas><svg id="overlaySvg" viewBox="0 0 400 300" preserveAspectRatio="none" aria-hidden="true"></svg></div></div></section>
<div id="rightWidthSplitter" class="width-splitter" tabindex="0" aria-label="调整右侧栏宽度"></div>
<aside id="rightSidebar" class="sidebar right"><section id="rightTopPane" class="dock-pane"><h3 class="dock-title">属性</h3><div id="properties" class="dock-scroll"></div></section><div id="rightPaneSplitter" class="pane-splitter horizontal" tabindex="0" aria-label="调整属性和历史高度"></div><section id="rightBottomPane" class="dock-pane"><h3 class="dock-title">历史记录</h3><div id="historyDock" class="dock-scroll"></div></section></aside>
</main>
<footer class="status"><span id="statusText">启动中…</span><span id="cursorStatus">x: — y: —</span><span id="selectionStatus">未选择</span><span id="noticeText"></span></footer>
</div>
<div id="contextMenu" class="context-menu"><button data-context="duplicate">复制图层</button><button data-context="rasterize">栅格化子树</button><button data-context="save-image">图片另存为</button><button data-context="copy-image">复制图片</button><button data-context="delete" class="danger">删除</button></div>
<input id="fileImage" type="file" accept="image/png,image/jpeg,image/webp,.xbm,image/svg+xml" hidden><input id="fileFont" type="file" accept=".ttf,.otf,.woff,.woff2" multiple hidden><input id="fileProject" type="file" accept=".pix" hidden>
<script type="module" src="./src/main.js"></script></body></html>
