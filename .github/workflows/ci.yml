name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install
          ROLLUP_VERSION="$(node -p "require('./node_modules/rollup/package.json').version")"
          npm install --no-save "@rollup/rollup-linux-x64-gnu@${ROLLUP_VERSION}"

      - name: Install Chromium
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Application boot diagnostics
        run: npx playwright test tests/bootstrap-diagnostics.spec.js

      - name: Run browser regression tests
        run: npm test

      - name: Cross-browser compatibility smoke tests
        run: npm run test:compat

      - name: Build production bundle
        run: npm run build

      - name: Test production preview
        run: npm run test:preview
