name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install
          ROLLUP_VERSION="$(node -p "require('./node_modules/rollup/package.json').version")"
          npm install --no-save "@rollup/rollup-linux-x64-gnu@${ROLLUP_VERSION}"

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run v17 bootstrap diagnostic
        shell: bash
        run: |
          set +e
          npx playwright test tests/bootstrap-diagnostic.spec.js --reporter=json > playwright-report.json
          echo "$?" > playwright-exit-code
          exit 0

      - name: Upload browser regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-json-report
          path: playwright-report.json
          retention-days: 1

      - name: Enforce browser regression result
        shell: bash
        run: |
          code="$(cat playwright-exit-code)"
          if [ "$code" -ne 0 ]; then
            echo "Browser regression tests failed with exit code $code"
            exit "$code"
          fi

      - name: Build production bundle
        run: npm run build

      - name: Test production preview
        run: npm run test:preview
