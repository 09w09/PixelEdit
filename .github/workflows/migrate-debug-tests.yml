name: Migrate Debug API Tests

on:
  push:
    branches:
      - refactor/esm-rendering-media
    paths:
      - scripts/migrate-debug-api-tests.mjs
      - .github/workflows/migrate-debug-tests.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/esm-rendering-media
          fetch-depth: 1
      - name: 迁移测试调试接口
        run: node scripts/migrate-debug-api-tests.mjs
      - name: 删除一次性迁移文件
        run: |
          rm -f scripts/migrate-debug-api-tests.mjs
          rm -f .github/workflows/migrate-debug-tests.yml
      - name: 校验并提交迁移结果
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "test: 迁移到显式调试接口"
          git push origin HEAD:refs/heads/refactor/esm-rendering-media
