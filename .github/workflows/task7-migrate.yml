name: Task 7 migration

on:
  push:
    branches:
      - refactor/v17-core-architecture
    paths:
      - scripts/task7-migrate.mjs
      - src/app/v17-workspace.js
      - .github/workflows/task7-migrate.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Task 7 codemod
        run: node scripts/task7-migrate.mjs
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git diff --cached --check
          git commit -m "refactor: 收敛 V17 运行时补丁"
          git push origin HEAD:refactor/v17-core-architecture
